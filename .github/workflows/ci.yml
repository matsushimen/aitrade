name: CI

on:
  push:
    branches: ['main', 'ci/**']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  required:
    name: Required checks
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success

  distribution:
    name: Source distribution
    needs: required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build source archive and checksum
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=aitrade/ --output=dist/aitrade.tar.gz HEAD
          cd dist
          sha256sum aitrade.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aitrade-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
